name: AB-GRAFCET Studio · pruebas y capturas reales
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'AB-GRAFCET-Studio-PORTABLE.html'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/grafcet-ci.yml'
  workflow_dispatch:
concurrency:
  group: ab-grafcet-studio-main-capturas
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tests-and-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test de sintaxis y motor
        run: |
          node --check src/engine.js
          node --check src/app.js
          node --test tests/*.test.js
      - name: Instalar Chromium de pruebas
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Pruebas de navegador de ambas versiones
        run: python -m unittest discover -s tests -p 'test_browser*.py' -v
      - name: Capturas reales con el simulador
        run: python tools/capture_screenshots.py
      - name: Guardar capturas como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AB-GRAFCET-Studio-capturas-reales
          path: docs/screenshots/grafcet-*.png
          if-no-files-found: error
      - name: Publicar capturas en la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish real Chromium screenshots of AB-GRAFCET Studio'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
